<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Solar Inspection</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a1218;color:#c8d6e5;overflow:hidden;height:100vh;font-size:14px}
:root{--accent:#00ffcc;--warn:#f5a623;--danger:#ff5d6c;--muted:#7a8b9a}
.topbar{position:relative;z-index:100;display:flex;align-items:center;padding:10px 24px;background:#0d161c;border-bottom:1px solid rgba(255,255,255,0.06);height:56px}
.topbar .brand{font-weight:800;font-size:22px;color:var(--accent)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative;z-index:101}
.top-action-btn{border:1px solid rgba(0,255,204,.28);border-radius:4px;background:rgba(0,255,204,.06);color:var(--accent);padding:4px 9px;cursor:pointer;font-size:12px;font-weight:700;text-transform:uppercase}
.top-action-btn:hover{background:rgba(0,255,204,.14)}
.top-action-btn.restart{border-color:rgba(255,93,108,.35);color:#ff8899;background:rgba(255,93,108,.08)}
.top-action-btn.restart:hover{background:rgba(255,93,108,.16)}
.pause-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(0,255,204,.25);border-left:none;border-radius:0 5px 5px 0;background:rgba(0,255,204,.05);color:var(--accent);cursor:pointer;font-size:12px;padding:3px 7px;vertical-align:middle;line-height:1.2;transition:background .15s}
.pause-btn:hover{background:rgba(0,255,204,.16)}
.pause-btn.paused{color:var(--warn);border-color:rgba(245,166,35,.35);background:rgba(245,166,35,.08)}
.pause-btn.paused:hover{background:rgba(245,166,35,.16)}
.main{display:grid;grid-template-columns:220px 1fr 280px;height:calc(100vh - 56px)}
#left-panel{background:#0d161c;border-right:1px solid rgba(255,255,255,0.05);display:flex;flex-direction:column;overflow:hidden}
#left-tabs{flex-shrink:0}
#left-tab-content{display:none}
#right-panel{background:#0d161c;border-left:1px solid rgba(255,255,255,0.05);overflow-y:auto;padding:12px}
.tab-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 14px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-weight:600;text-align:left;border-left:3px solid transparent;font-size:13px}
.tab-btn:hover{background:rgba(255,255,255,0.04)}
.tab-btn.active{color:var(--accent);background:rgba(0,255,204,0.06);border-left-color:var(--accent)}
.tab-icon{font-size:16px;width:20px;text-align:center}
#fleet-mini{padding:8px;border-top:1px solid rgba(255,255,255,0.06);flex-shrink:0;margin-top:auto;max-height:420px;overflow-y:auto}
.fleet-card{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:5px;margin-bottom:3px;cursor:pointer;font-size:12px;border:1px solid transparent}
.fleet-card:hover{border-color:rgba(0,255,204,0.2);background:rgba(0,255,204,0.04)}
.fleet-card.selected{border-color:var(--accent)!important;background:rgba(0,255,204,0.1)!important}
.fleet-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--accent)}
.fleet-dot.working{background:var(--warn)}
.fleet-name{font-weight:600;flex:1;font-size:11px}
.fleet-batt{font-size:11px;color:var(--muted)}
.fleet-label{font-size:10px;color:var(--muted);padding:4px 8px}
#center-panel{display:flex;flex-direction:column;overflow:hidden}
#sim-wrap{position:relative;overflow:hidden;background:#101719;flex:1.5;min-height:280px}
#sim-wrap canvas{position:absolute;left:0;top:0;z-index:1}
.sim-toolbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.48);border:1px solid rgba(0,255,204,.22);border-radius:7px;padding:5px 7px;backdrop-filter:blur(4px);pointer-events:auto}
.sim-toolbar-label{font-size:11px;color:var(--muted);margin-right:2px}
.speed-btn{min-width:34px;border:1px solid rgba(0,255,204,.28);border-radius:4px;background:rgba(0,255,204,.06);color:#9fb4bf;padding:3px 7px;cursor:pointer;font-size:11px;font-weight:700}
.speed-btn.active,.view-btn.active{background:rgba(0,255,204,.2);border-color:var(--accent);color:var(--accent)}
.view-btn{min-width:46px;border:1px solid rgba(0,255,204,.28);border-radius:4px;background:rgba(0,255,204,.06);color:#9fb4bf;padding:3px 7px;cursor:pointer;font-size:11px;font-weight:700}
#coord-hud{position:absolute;left:10px;bottom:10px;z-index:10;background:rgba(0,0,0,.55);border:1px solid rgba(0,255,204,.25);border-radius:5px;padding:7px 9px;font-family:monospace;font-size:11px;color:#c8d6e5;line-height:1.45;pointer-events:none}
#center-bottom{flex:1;display:flex;flex-direction:column;background:#0d161c;border-top:1px solid rgba(255,255,255,0.06);min-height:120px}
#page-wrap{display:none;height:100%;overflow-y:auto;background:#0d161c;padding:18px 22px}
#fpv-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 8px;flex:1;min-height:0}
.fpv-box{background:#0a1218;border-radius:4px;position:relative;overflow:hidden;min-height:60px}
.fpv-label{position:absolute;top:3px;left:6px;font-size:11px;color:var(--muted);z-index:1}
.fpv-select{position:absolute;top:3px;right:6px;z-index:2;background:#111b21;color:var(--accent);border:1px solid rgba(0,255,204,0.3);border-radius:3px;font-size:10px;padding:1px 4px;cursor:pointer;font-family:inherit}
#ai-row{padding:8px 10px;border-top:1px solid rgba(255,255,255,0.06)}
h3{color:var(--accent);font-size:14px;text-transform:uppercase;margin-bottom:8px}
h4{color:var(--accent);font-size:12px;margin-bottom:4px}
.card{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.06);border-radius:6px;padding:10px 12px;margin-bottom:8px;font-size:12px}
.card-row{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.card-row .val{font-weight:600}
.progress-bar{width:100%;height:5px;background:rgba(255,255,255,0.08);border-radius:2px;margin:3px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px}
.tag{padding:2px 5px;border-radius:3px;font-size:10px;font-weight:600;display:inline-block;margin:1px}
.tag.green{background:rgba(0,255,204,0.15);color:var(--accent)}
.tag.yellow{background:rgba(245,166,35,0.15);color:var(--warn)}
.tag.red{background:rgba(255,93,108,0.15);color:var(--danger)}
.tag.blue{background:rgba(100,160,255,0.15);color:#88bbff}
button{font-family:inherit}
.btn{border:1px solid rgba(0,255,204,0.3);border-radius:4px;background:rgba(0,255,204,0.08);color:var(--accent);padding:5px 9px;cursor:pointer;font-weight:600;font-size:12px}
.btn:hover{background:rgba(0,255,204,0.16)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.saving{background:rgba(245,166,35,.22);border-color:var(--warn);color:var(--warn);opacity:1}
.btn.saved{background:rgba(0,255,204,.28);border-color:var(--accent);color:var(--accent);opacity:1}
.btn.failed{background:rgba(255,93,108,.22);border-color:var(--danger);color:var(--danger);opacity:1}
.save-badge{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:4px;font-size:11px;font-weight:700}
.save-badge.ok{background:rgba(0,255,204,.16);color:var(--accent)}
.save-badge.fail{background:rgba(255,93,108,.16);color:var(--danger)}
.settings-section{background:rgba(0,255,204,.035);border:1px solid rgba(0,255,204,.16);border-radius:10px;padding:14px;margin-bottom:14px}
.settings-section h4{font-size:14px;margin-bottom:10px;letter-spacing:.04em}
.settings-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.settings-heading h4{margin-bottom:0}
.setting-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.06)}
.setting-item:first-of-type{border-top:none}
.setting-title{font-size:14px;font-weight:800;color:#d7edf2}
.setting-desc{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35}
.setting-control{min-width:118px;display:flex;justify-content:flex-end;align-items:center;gap:8px}
.settings-select,.settings-input{background:#111b21;color:var(--accent);border:1px solid rgba(0,255,204,.38);border-radius:6px;font-size:13px;font-weight:800;padding:7px 10px;font-family:inherit}
.settings-input{width:84px;color:#c8d6e5}
.settings-checkbox{width:20px;height:20px;accent-color:#00ffcc}
.settings-save{width:100%;padding:10px 12px;font-size:14px;border-radius:7px;margin-top:4px}
.ai-test-result{font-size:11px;color:var(--muted);line-height:1.45;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)}
textarea{width:100%;padding:8px;border:1px solid rgba(0,255,204,0.3);border-radius:4px;background:#111b21;color:#c8d6e5;font-size:12px;resize:none;font-family:inherit}
.pipeline-step{padding:4px 8px;margin:3px 0;border-left:2px solid rgba(0,255,204,0.3);background:rgba(0,0,0,0.2);font-size:11px}
.pipeline-step.fail{border-left-color:var(--danger);color:#ff8899}
.pipeline-step.ok{border-left-color:var(--accent)}
.pipeline-json{font-family:monospace;font-size:10px;white-space:pre-wrap;color:#9ab;color:rgba(154,187,255,0.9);background:rgba(0,0,0,0.3);padding:6px;border-radius:4px;margin-top:4px;max-height:80px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;scrollbar-gutter:stable}
.skill-category{margin:10px 0}
.skill-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.045);line-height:1.45}
.skill-row:first-of-type{border-top:none}
.skill-label{color:var(--muted);font-size:11px;white-space:nowrap}
.skill-eg{margin-left:auto;color:var(--muted);font-size:10px;text-align:right;white-space:nowrap;opacity:.88}
.task-node-row{display:flex;gap:5px;margin:7px 0;align-items:stretch}
.task-node{flex:1;min-width:34px;border:1px solid rgba(255,255,255,.09);border-radius:5px;padding:5px 4px;text-align:center;font-size:10px;color:var(--muted);background:rgba(255,255,255,.025)}
.task-node.done{border-color:rgba(0,255,204,.45);color:var(--accent);background:rgba(0,255,204,.08)}
.task-node.active{border-color:rgba(245,166,35,.65);color:var(--warn);background:rgba(245,166,35,.1)}
.task-node.blocked{border-color:rgba(245,166,35,.8);color:var(--warn);background:rgba(245,166,35,.14)}
.task-node.failed{border-color:rgba(255,93,108,.65);color:var(--danger);background:rgba(255,93,108,.1)}
.task-progress{position:relative;margin:8px 0 5px}
.task-progress .progress-bar{margin:0}
.task-dot{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:#18242a;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #0d161c}
.task-dot.done{border-color:var(--accent);background:var(--accent)}
.task-dot.active{border-color:var(--warn);background:var(--warn)}
.task-dot.failed{border-color:var(--danger);background:var(--danger)}
.task-log{font-size:10px;color:var(--muted);max-height:92px;overflow-y:auto;line-height:1.45;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;scrollbar-gutter:stable}
.right-task-log{max-height:130px;overflow-y:auto;font-size:10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;scrollbar-gutter:stable}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.stat-box{background:rgba(0,255,204,0.04);border:1px solid rgba(0,255,204,0.1);border-radius:4px;padding:8px;text-align:center}
.stat-box .num{font-size:20px;font-weight:800;color:var(--accent)}
.stat-box .lbl{font-size:10px;color:var(--muted)}
.analytics-legend{display:flex;flex-wrap:wrap;gap:3px 10px;justify-content:center;font-size:10px;margin-top:8px}
.analytics-legend span{display:inline-flex;align-items:center;gap:3px}
.analytics-legend .dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.activity-chart{margin-top:24px}
.activity-chart h4{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.activity-chart .chart-wrap{position:relative;width:70%;margin:0 auto}
.activity-chart svg{display:block;width:100%;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:6px}
.panel-filter-row{display:flex;gap:6px;margin-bottom:8px}
.panel-filter-row input{flex:1;min-width:0;background:#111b21;color:#c8d6e5;border:1px solid rgba(0,255,204,.3);border-radius:5px;padding:7px;font-size:12px}
.panel-matrix{display:grid;gap:5px;padding-right:2px}
.panel-cell{border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:3px 4px;cursor:pointer;background:rgba(40,120,255,.16);font-size:10px;line-height:1.2;color:#d9e8f0}
.panel-cell:hover,.panel-cell.selected{border-color:var(--accent);box-shadow:0 0 0 1px rgba(0,255,204,.22)}
.panel-cell.green{background:rgba(0,255,204,.15)}
.panel-cell.yellow{background:rgba(245,166,35,.18)}
.panel-cell.red{background:rgba(255,93,108,.18)}
.panel-cell .panel-pos{font-weight:800}
.panel-cell .panel-time{color:var(--muted);font-size:9px;margin-top:2px}
.panel-action-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.mode-badge{margin-left:16px;font-size:12px;font-weight:800;border:1px solid rgba(245,166,35,.35);border-radius:5px;padding:3px 8px;color:var(--warn);background:rgba(245,166,35,.08);line-height:1.2}
.mode-badge.ready{border-color:rgba(0,255,204,.38);color:var(--accent);background:rgba(0,255,204,.08)}
.time-badge{font-size:12px;font-weight:800;border:1px solid rgba(0,255,204,.25);border-radius:5px 0 0 5px;padding:3px 8px;color:#c8d6e5;background:rgba(0,255,204,.05);white-space:nowrap;line-height:1.2;display:inline-block;width:175px;text-align:center}
.time-group{display:inline-flex;align-items:center;margin-left:12px}
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">Solar Inspection</span>
  <span id="llm-badge" class="mode-badge">Command mode: Guided</span>
  <span class="time-group"><span id="sim-time-badge" class="time-badge">Time: --</span><button id="pause-btn" class="pause-btn" title="Pause / Resume simulation">&#9654;</button></span>
  <div class="top-actions">
    <span id="conn-dot" style="color:#ff4444;font-size:13px">&#11044; Offline</span>
    <button class="top-action-btn" id="update-btn">Refresh</button>
    <button class="top-action-btn restart" id="restart-btn">Reset demo</button>
  </div>
</div>
<div class="main">
  <div id="left-panel">
    <div id="left-tabs">
      <button class="tab-btn active" data-tab="overview"><span class="tab-icon">&#127968;</span>Overview</button>
      <button class="tab-btn" data-tab="robots"><span class="tab-icon">&#129302;</span>Robots</button>
      <button class="tab-btn" data-tab="tasks"><span class="tab-icon">&#128203;</span>Tasks</button>
      <button class="tab-btn" data-tab="panels"><span class="tab-icon">&#128421;</span>Panel Monitor</button>
      <button class="tab-btn" data-tab="faults"><span class="tab-icon">&#128680;</span>Faults</button>
      <button class="tab-btn" data-tab="analytics"><span class="tab-icon">&#128200;</span>Analytics</button>
      <button class="tab-btn" data-tab="ai"><span class="tab-icon">&#129504;</span>AI Command</button>
      <button class="tab-btn" data-tab="safety"><span class="tab-icon">&#128737;</span>Safety</button>

    </div>
    <div id="left-tab-content"></div>
    <div id="fleet-mini"></div>
  </div>
  <div id="center-panel">
    <div id="sim-wrap"><div class="sim-toolbar"><span class="sim-toolbar-label">Sim Speed</span><button class="speed-btn active" data-speed="1">1x</button><button class="speed-btn" data-speed="2">2x</button><button class="speed-btn" data-speed="4">4x</button><span class="sim-toolbar-label" style="margin-left:8px">View</span><button class="view-btn active" data-view="free">Free</button><button class="view-btn" data-view="follow">Follow</button></div><div id="coord-hud">X: -- | Z: -- | Y: --</div></div>
    <div id="center-bottom">
      <div id="fpv-row">
        <div class="fpv-box" id="fpv-drone"><span class="fpv-label" id="fpv-drone-label">Drone-01 FPV</span><select class="fpv-select" id="fpv-drone-select"><option value="0">Drone-01</option><option value="1">Drone-02</option><option value="2">Drone-03</option><option value="3">Drone-04</option><option value="4">Drone-05</option></select></div>
        <div class="fpv-box" id="fpv-go2"><span class="fpv-label" id="fpv-go2-label">Go2-01 FPV</span><select class="fpv-select" id="fpv-go2-select"><option value="0">Go2-01</option><option value="1">Go2-02</option><option value="2">Go2-03</option><option value="3">Go2-04</option><option value="4">Go2-05</option></select></div>
      </div>
      <div id="ai-row"></div>
    </div>
    <div id="page-wrap"></div>
  </div>
  <div id="right-panel"></div>
</div>

<script src="./three.min.js"></script>
<script src="./ColladaLoader.js"></script>
<script src="./go2_visual.js"></script>
<script>
var scene,camera,renderer,terrainMesh,raycaster,sceneReady=false,coordGuideGroup=null;
var droneMeshes=[],panelMeshes=[],baseMarkers=[],go2Models=[],go2UrdfTemplate=null,go2ModelsReady=false,go2RouteLines=[],walkableRegionGroup=null,lastWalkableRegionHash='';
var PG,PTG,TILT;
var DRONE_PAD_TOP_Y=0.72,DRONE_PARK_Y=0.65;
var GO2_VISUAL_YAW_OFFSET=0;
var ct=1.2,cp=.7,cd=60,ctg=new THREE.Vector3(0,3,0),drag=false,pm={x:0,y:0};
var smoothTarget=new THREE.Vector3(),followRobot=null;
var activeTab='overview',lastPipeline=null;
var selectedPanelKey=null,panelRowFilter='',panelColFilter='';
var showAssistInfo=localStorage.getItem('solar_show_assist_info')!=='false';
var simViewMode=localStorage.getItem('solar_sim_view_mode')||'free',freeKeys={};
var aiTestStatus={cls:'',text:''};
var settingsSaving=false;
var activityHistory={drones:{},go2s:{}};
var lastActivitySample=0;
function sampleActivity(d){
  var now=Date.now();
  if(now-lastActivitySample<1000)return;
  lastActivitySample=now;
  function act(robot,kind){
    var s=robot.status||'idle';
    var prevBatt=robot._prevBatt;
    var drainRate=prevBatt!=null?Math.max(0,(prevBatt-(robot.battery||100))):0;
    robot._prevBatt=robot.battery;
    if(s==='idle'||s==='landed')return 0;
    var base=s==='inspecting'?0.7:s==='scanning'||s==='flying'||s==='moving'?0.5:s==='returning'||s==='taking_off'?0.35:0.25;
    return Math.min(1,base+drainRate*2);
  }
  var t=currentSimNow(store);
  (store.drones||[]).forEach(function(dd){
    if(!activityHistory.drones[dd.name])activityHistory.drones[dd.name]=[];
    var h=activityHistory.drones[dd.name];
    h.push({t:t,v:act(dd,'drone')});
    if(h.length>600)h.shift();
  });
  (store.go2s||[]).forEach(function(gg){
    if(!activityHistory.go2s[gg.name])activityHistory.go2s[gg.name]=[];
    var h=activityHistory.go2s[gg.name];
    h.push({t:t,v:act(gg,'go2')});
    if(h.length>600)h.shift();
  });
}

function n2d(x,y){return Math.sin(x*12.9898+y*78.233)*43758.5453-Math.floor(Math.sin(x*12.9898+y*78.233)*43758.5453)}
function fbm(x,y,o){o=o||6;var v=0,a=0.5,f=1;for(var i=0;i<o;i++){v+=a*n2d(x*f,y*f);a*=0.5;f*=2}return v}
function getGroundHeight(x,z){if(!terrainMesh||!raycaster)return 0;raycaster.set(new THREE.Vector3(x,50,z),new THREE.Vector3(0,-1,0));var hits=raycaster.intersectObject(terrainMesh);return hits.length>0?hits[0].point.y:0}
function go2WorldY(gi){if(gi.pose&&gi.pose.world_y!=null)return gi.pose.world_y;var gh=getGroundHeight(gi.pose.x,gi.pose.y);return gh+(gi.pose.z||0.35)}
function go2VisualY(gi,gm){
  return window.GO2Visual?GO2Visual.visualY(gi,gm):getGroundHeight(gi.pose.x,gi.pose.y)+0.35;
}
function go2HeadHeight(gm){
  var h=gm&&gm.userData&&isFinite(gm.userData.visualHeight)?gm.userData.visualHeight*.72:.55;
  return Math.max(.45,Math.min(1.05,h));
}
function makeTextSprite(text,color){
  var canvas=document.createElement('canvas');canvas.width=256;canvas.height=80;
  var ctx=canvas.getContext('2d');ctx.clearRect(0,0,256,80);

async function dispatchAI(text,opts){
  opts=opts||{};
  lastPipeline={text:text,steps:[],ok:false};
  lastPipeline.steps.push({label:'1. Input',text:text,ok:true});
  try{
    var target=opts.robot||selectedDispatchRobot();
    var res=await fetch('./api/ai-command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,robot:target})});
    var data=await res.json();
    lastPipeline.steps.push({label:'2. Parser',text:'source: '+(data.source||'none')+(data.llm_available?' (LLM available)':' (rules only)'),ok:data.ok});
    lastPipeline.steps.push({label:'3. JSON',text:JSON.stringify(data.parsed_json||data.actions,null,2),ok:data.ok,isJson:true});
    if(data.dispatch_log&&data.dispatch_log.length){
      data.dispatch_log.forEach(function(line){lastPipeline.steps.push({label:'4. Dispatch',text:line,ok:true})});
    }else if(data.error){
      lastPipeline.steps.push({label:'4. Dispatch',text:data.error,ok:false});
    }
    lastPipeline.ok=data.ok;
    if(data.ok){
      var lines=(data.dispatch_log&&data.dispatch_log.length)?data.dispatch_log:[target+' accepted task: '+text];
      var now=new Date().toLocaleTimeString();
      lines.forEach(function(line){cmdLog.push({text:line,time:now})});
      cmdLog=cmdLog.slice(-20);
    }
  }catch(err){
    lastPipeline.steps.push({label:'Error',text:String(err),ok:false});
  }
  renderBottom(store);
  if(!opts.noTabRefresh)showActiveTab(true);
}

function panelDonut(panels){
  var counts={unknown:0,healthy:0,drone_anomaly:0,confirmed_fault:0,repaired:0};
  panels.forEach(function(p){if(counts.hasOwnProperty(p.status))counts[p.status]++});
  var colors={unknown:'#88bbff',healthy:'#00ffcc',drone_anomaly:'#f5a623',confirmed_fault:'#ff5d6c',repaired:'#44cc88'};
  var labels={unknown:'Unknown',healthy:'Healthy',drone_anomaly:'Anomaly',confirmed_fault:'Fault',repaired:'Repaired'};
  var total=panels.length||1;
  var r=62,sw=18,cx=80,cy=80,size=160;
  var circ=2*Math.PI*r;
  var html='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="display:block;margin:0 auto">';
  html+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="'+sw+'"/>';
  var offset=0;
  Object.keys(counts).forEach(function(k){
    var pct=counts[k]/total;
    if(pct<=0)return;
    var dash=circ*pct;
    html+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+colors[k]+'" stroke-width="'+sw+'" stroke-dasharray="'+dash+' '+(circ-dash)+'" transform="rotate('+(offset-90)+' '+cx+' '+cy+')"/>';
    offset+=pct*360;
  });
  html+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="30" font-weight="800" fill="#c8d6e5">'+total+'</text>';
  html+='<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="11" fill="#7a8b9a">panels</text>';
  html+='</svg>';
  var legend='<div class="analytics-legend">';
  Object.keys(counts).forEach(function(k){
    legend+='<span><span class="dot" style="background:'+colors[k]+'"></span>'+labels[k]+' <b>'+counts[k]+'</b></span>';
  });
  legend+='</div>';
  return'<div style="text-align:center;margin-bottom:24px">'+html+legend+'</div>';
}
function renderLineChart(title,pts,color){
  var vbW=280,vbH=90,padL=20,padR=4,padT=10,padB=20;
  var pw=vbW-padL-padR,ph=vbH-padT-padB;
  if(!pts||!pts.length)return'<div class="activity-chart"><h4>'+title+'</h4><div style="font-size:10px;color:var(--muted);padding:8px">No data yet</div></div>';
  var tMax=pts[pts.length-1].t,WINDOW=600,tMin=tMax-WINDOW;
  function tx(t){return padL+(t-tMin)/(tMax-tMin)*pw}
  function ty(v){return padT+ph-(v/5)*ph}
  function fmtTime(t){var sec=Math.max(0,Math.floor(tMax-t));if(sec<60)return sec+'s ago';if(sec<3600)return Math.floor(sec/60)+'m ago';return Math.floor(sec/3600)+'h ago';}
  var svg='<svg viewBox="0 0 '+vbW+' '+vbH+'" preserveAspectRatio="xMidYMid meet">';
  svg+='<rect x="'+padL+'" y="'+padT+'" width="'+(vbW-padL-padR)+'" height="'+ph+'" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>';
  for(var v=0;v<=5;v++){
    var y=ty(v);
    svg+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(vbW-padR)+'" y2="'+y.toFixed(1)+'" stroke="rgba(255,255,255,'+(v===0?'0.08':'0.04')+')" stroke-width="1" stroke-dasharray="'+(v===0?'3,4':'2,5')+'"/>';
    svg+='<text x="'+(padL-3)+'" y="'+(y+3)+'" text-anchor="end" font-size="7" fill="#7a8b9a">'+v+'</text>';
  }
  var tTicks=[];for(var i=0;i<=4;i++)tTicks.push(tMax-WINDOW*i/4);
  tTicks.forEach(function(tl){
    var x=tx(tl);
    svg+='<line x1="'+x.toFixed(1)+'" y1="'+(padT+ph)+'" x2="'+x.toFixed(1)+'" y2="'+(padT+ph+3)+'" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>';
    svg+='<text x="'+x.toFixed(1)+'" y="'+(padT+ph+11)+'" text-anchor="middle" font-size="7" fill="#7a8b9a">'+fmtTime(tl)+'</text>';
  });
  var visible=[];for(var i=0;i<pts.length;i++){if(pts[i].t>=tMin)visible.push(pts[i])}
  if(visible.length){
    var d='M'+tx(visible[0].t).toFixed(1)+','+ty(visible[0].v).toFixed(1);
    for(var i=1;i<visible.length;i++)d+=' L'+tx(visible[i].t).toFixed(1)+','+ty(visible[i].v).toFixed(1);
    svg+='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="0.9" opacity="0.85"/>';
  }
  svg+='</svg>';
  return'<div class="activity-chart"><h4>'+title+'</h4><div class="chart-wrap">'+svg+'</div></div>';
}

      +'</div>'
      +'<div class="settings-section"><div class="settings-heading"><h4>AI Parser</h4><span class="tag '+(ai.api_key_set?'green':'yellow')+'">'+(ai.api_key_set?'Ready':'Rules only')+'</span></div>'

      +'<div class="setting-item"><div><div class="setting-title">Base URL</div><div class="setting-desc">Runtime only. OpenAI-compatible DeepSeek default is https://api.deepseek.com. Anthropic-compatible endpoint is https://api.deepseek.com/anthropic.</div></div><div class="setting-control"><input id="ai-base-url" class="settings-input" style="width:260px" value="'+esc(ai.base_url||'https://api.deepseek.com')+'" onfocus="markPageInteraction()" onpointerdown="markPageInteraction()" onchange="markPageInteraction()"></div></div>'
      +'<div class="setting-item"><div><div class="setting-title">Model</div><div class="setting-desc">Default model is deepseek-v4-flash. deepseek-v4-pro is also available; deepseek-chat and deepseek-reasoner are deprecated after 2026/07/24.</div></div><div class="setting-control"><input id="ai-model" class="settings-input" style="width:180px" value="'+esc(ai.model||'deepseek-v4-flash')+'" onfocus="markPageInteraction()" onpointerdown="markPageInteraction()" onchange="markPageInteraction()"></div></div>'
      +'<div class="setting-item"><div><div class="setting-title">API Key</div><div class="setting-desc">Stored only in backend memory. Update preserves it; Restart clears it. After saving, only the first and last characters are shown.</div></div><div class="setting-control"><input id="ai-api-key" class="settings-input" style="width:220px" value="'+esc(ai.api_key_masked||'')+'" placeholder="'+(ai.runtime_key_set?'Key is set':'Paste DeepSeek key')+'" onfocus="markPageInteraction()" onpointerdown="markPageInteraction()" onchange="markPageInteraction()"><button class="btn" onclick="clearAIKey()">Clear</button></div></div>'

      +'<div class="settings-section"><h4>Apply Changes</h4>'
      +'<button class="btn settings-save" id="save-settings-btn" onclick="saveSettings()">Save Settings</button>'
      +'</div>';
  }else if(activeTab==='safety'){
    h='<h3>Safety / CAS</h3><div class="card"><h4>Connection</h4><div class="card-row"><span>Operations link</span><span class="tag '+(online?'green':'red')+'">'+(online?'Online':'Offline')+'</span></div><div class="card-row"><span>Command interpretation</span><span class="tag '+(d.llm_available?'green':'yellow')+'">'+(d.llm_available?'AI-assisted':'Guided')+'</span></div></div>'
      +'<div class="card"><h4>Geofence</h4><div class="card-row"><span>Boundary</span><span class="tag green">ACTIVE</span></div><div class="card-row"><span>Range</span><span class="val">'+(d.farm&&d.farm.boundary?d.farm.boundary.x_min.toFixed(0)+'..'+d.farm.boundary.x_max.toFixed(0):'?')+'</span></div></div>'
      +'<div class="card"><h4>CAS Risk</h4><div class="card-row"><span>Level</span><span class="tag green">LOW</span></div><div class="card-row"><span>Units</span><span class="val">'+(di.length+gi.length)+'</span></div></div>';
  }else if(activeTab==='intro'){
    h='<h3>Introduction</h3><div class="card"><h4>Skills</h4><div style="font-size:11px;color:var(--muted);margin-bottom:8px">Only skills listed here are executable in this solar inspection demo.</div>';
    var skills=d.skills||[];
    var cats={};skills.forEach(function(s){if(!cats[s.category])cats[s.category]=[];cats[s.category].push(s)});
    Object.keys(cats).forEach(function(cat){
      h+='<div class="skill-category"><h4>'+cat.charAt(0).toUpperCase()+cat.slice(1)+'</h4>';
      cats[cat].forEach(function(s){h+='<div class="skill-row"><span class="tag green">'+esc(s.skill)+'</span><span class="skill-label">'+esc(s.label)+'</span><span class="skill-eg">e.g. "'+esc(s.examples?s.examples[0]:'')+'"</span></div>'});
      h+='</div>';
    });
    h+='</div><div class="card"><h4>JSON Design</h4><div style="font-size:11px;color:var(--muted);margin-bottom:8px">Natural language is normalized into a task plan. The backend validates the fields, expands composite steps, creates TaskRecord nodes, and dispatches each action to the simulator.</div>'
      +'<div class="skill-row"><span class="tag blue">version</span><span class="skill-label">Schema marker. Current value is solar-command-v1 so the backend knows how to normalize the plan.</span></div>'
      +'<div class="skill-row"><span class="tag blue">intent</span><span class="skill-label">Short parser summary such as inspect_row, return_base, navigate_panel. Used for observability, not motion control.</span></div>'
      +'<div class="skill-row"><span class="tag blue">confidence</span><span class="skill-label">LLM confidence from 0 to 1. It is shown in AI Command traces; invalid commands are rejected by validation.</span></div>'
      +'<div class="skill-row"><span class="tag green">tasks</span><span class="skill-label">Top-level user goals. Multiple tasks are allowed when one command asks for separate work streams.</span></div>'
      +'<div class="skill-row"><span class="tag green">task.label</span><span class="skill-label">Human-readable title shown in Tasks and logs.</span></div>'
      +'<div class="skill-row"><span class="tag green">task.mode</span><span class="skill-label">sequential means steps run in order. parallel groups same-time work. conditional is used when later work depends on scan results.</span></div>'
      +'<div class="skill-row"><span class="tag yellow">steps</span><span class="skill-label">Progress nodes inside a task. Each step maps to one dot/node in the Tasks tab and completes from simulator state.</span></div>'
      +'<div class="skill-row"><span class="tag yellow">actions</span><span class="skill-label">Executable skill calls inside a step. Actions in the same step are dispatched together.</span></div>'
      +'<div class="skill-row"><span class="tag red">action.skill</span><span class="skill-label">Must be one executable skill listed above, for example drone_scan_row, go2_navigate, go2_return_base.</span></div>'
      +'<div class="skill-row"><span class="tag red">action.robot</span><span class="skill-label">Optional target: Drone-01..05, Go2-01..05, auto, Go2 Fleet, or Fleet. If omitted, the selected UI robot or skill default is used.</span></div>'
      +'<div class="skill-row"><span class="tag red">row / col / panels</span><span class="skill-label">Panel coordinates. row and col address one panel; panels is a list of [row,col] pairs for batch scans or confirmations.</span></div>'
      +'<div class="skill-row"><span class="tag red">params</span><span class="skill-label">Skill-specific numeric values. Movement uses distance_m; turning uses angle_deg with a 90 degree default.</span></div>'
      +'<div class="skill-row"><span class="tag red">desc</span><span class="skill-label">Optional action text shown in logs and task details.</span></div></div>';
  }else if(activeTab==='ai'){
    var ai=d.ai_parser||{};
    h='<h3>AI Command History</h3><div class="card"><div class="card-row"><span>Command interpretation</span><span class="tag '+(ai.api_key_set?'green':'yellow')+'">'+(ai.api_key_set?'AI-assisted':'Guided')+'</span></div><div class="card-row"><span>Safety validation</span><span class="tag green">ACTIVE</span></div></div>';
    var traces=d.command_traces||[];
    if(!traces.length)h+='<div class="card"><span style="color:var(--muted)">No commands yet. Use the input below.</span></div>';
    traces.slice().reverse().forEach(function(tr){
      h+='<div class="card"><div class="card-row"><span style="font-size:10px;color:var(--muted)">'+tr.id+'</span><span class="tag '+(tr.ok?'green':'red')+'">'+tr.source+'</span></div><div style="margin:4px 0">'+esc(tr.text)+'</div>';
      h+='<div class="pipeline-step '+(tr.ok?'ok':'fail')+'">Selected context: '+esc(tr.selected_robot||'none')+'</div>';
      if(tr.llm_request_summary&&Object.keys(tr.llm_request_summary).length)h+='<div class="pipeline-step ok">LLM request: '+esc(JSON.stringify(tr.llm_request_summary))+'</div>';
      if(tr.normalized_json&&Object.keys(tr.normalized_json).length)h+='<h4>Normalized JSON</h4><div class="pipeline-json">'+esc(JSON.stringify(tr.normalized_json,null,2))+'</div>';
      else if(tr.actions&&tr.actions.length)h+='<h4>Actions JSON</h4><div class="pipeline-json">'+esc(JSON.stringify({actions:tr.actions},null,2))+'</div>';
      if(tr.generated_tasks&&tr.generated_tasks.length)h+='<h4>Generated Tasks</h4><div class="pipeline-json">'+esc(JSON.stringify(tr.generated_tasks,null,2))+'</div>';
      if(tr.validation_errors&&tr.validation_errors.length)tr.validation_errors.forEach(function(e){h+='<div class="pipeline-step fail">'+esc(e)+'</div>'});
      if(tr.dispatch_log&&tr.dispatch_log.length)tr.dispatch_log.forEach(function(l){h+='<div class="pipeline-step ok">'+l+'</div>'});
      if(tr.error)h+='<div class="pipeline-step fail">'+tr.error+'</div>';
      h+='</div>';
    });
  }
  pageWrap.innerHTML=h;
}

function showActiveTab(force){
  var overview=activeTab==='overview';
  document.getElementById('sim-wrap').style.display=overview?'block':'none';
  document.getElementById('center-bottom').style.display=overview?'flex':'none';
  pageWrap.style.display=overview?'none':'block';
  pageWrap.style.overflowY=(activeTab==='panels')?'visible':'auto';
  var now=Date.now();
  if(!force&&!overview&&(now<pageInteractUntil||now-lastPageRender<1000))return;
  var outerScroll=pageWrap.scrollTop;
  var nestedScrolls=[].map.call(pageWrap.querySelectorAll('.pipeline-json,.task-log'),function(el){return el.scrollTop});
  renderLeftTab(store||{});
  if(!force&&!overview){
    pageWrap.scrollTop=outerScroll;
    [].forEach.call(pageWrap.querySelectorAll('.pipeline-json,.task-log'),function(el,i){if(nestedScrolls[i]!=null)el.scrollTop=nestedScrolls[i]});
  }
  lastPageRender=now;
}

var fpvDroneRenderer,fpvGo2Renderer,fpvDroneIdx=0,fpvGo2Idx=0;
function setupFpvRenderers(){
  var fd=document.getElementById('fpv-drone'),fg=document.getElementById('fpv-go2');
  if(!fpvDroneRenderer&&fd.clientWidth>0){fpvDroneRenderer=new THREE.WebGLRenderer({antialias:true});fpvDroneRenderer.setSize(fd.clientWidth,fd.clientHeight);fd.appendChild(fpvDroneRenderer.domElement)}
  if(!fpvGo2Renderer&&fg.clientWidth>0){fpvGo2Renderer=new THREE.WebGLRenderer({antialias:true});fpvGo2Renderer.setSize(fg.clientWidth,fg.clientHeight);fg.appendChild(fpvGo2Renderer.domElement)}
}
document.getElementById('fpv-drone-select').addEventListener('change',function(){fpvDroneIdx=Number(this.value)||0;document.getElementById('fpv-drone-label').textContent='Drone-0'+(fpvDroneIdx+1)+' FPV'});
document.getElementById('fpv-go2-select').addEventListener('change',function(){fpvGo2Idx=Number(this.value)||0;document.getElementById('fpv-go2-label').textContent='Go2-0'+(fpvGo2Idx+1)+' FPV'});
var aiRowBuilt=false;
function doSend(){var ta=document.getElementById('ai-cmd');var v=ta.value.trim();if(!v)return;dispatchAI(v);ta.value='';ta.focus()}
function renderBottom(d){
  if(!aiRowBuilt){
    document.getElementById('ai-row').innerHTML='<h4 style="color:var(--accent);margin-bottom:6px">Command</h4><textarea id="ai-cmd" placeholder="Selected robot receives this command, e.g. move forward" style="min-height:36px"></textarea><button class="btn" id="ai-send" style="margin-top:4px;width:100%">Execute</button>';
    document.getElementById('ai-send').addEventListener('click',doSend);
    document.getElementById('ai-cmd').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}});
    aiRowBuilt=true;
  }
  setupFpvRenderers();
}

function renderFpv(){
  if(!scene||!store)return;
  var fd=document.getElementById('fpv-drone'),fg=document.getElementById('fpv-go2');
  if(fd.clientWidth>0&&fpvDroneRenderer)fpvDroneRenderer.setSize(fd.clientWidth,fd.clientHeight);
  if(fg.clientWidth>0&&fpvGo2Renderer)fpvGo2Renderer.setSize(fg.clientWidth,fg.clientHeight);
  var fpvHiddenHelpers=go2RouteLines.slice();
  if(walkableRegionGroup)fpvHiddenHelpers.push(walkableRegionGroup);
  if(coordGuideGroup)fpvHiddenHelpers.push(coordGuideGroup);
  var helperVisibility=fpvHiddenHelpers.map(function(o){return o.visible});
  fpvHiddenHelpers.forEach(function(o){o.visible=false});
  if(fpvDroneRenderer&&store.drones){var di=Math.max(0,Math.min(fpvDroneIdx,store.drones.length-1));var d0=store.drones[di];if(d0){var dm=droneMeshes[di];if(dm)dm.visible=false;var h=d0.pose.z!=null?d0.pose.z:getGroundHeight(d0.pose.x,d0.pose.y)+0.5;var ground=getGroundHeight(d0.pose.x,d0.pose.y);var fc=new THREE.PerspectiveCamera(80,fd.clientWidth/Math.max(1,fd.clientHeight),0.1,200);fc.position.set(d0.pose.x,h-0.05,d0.pose.y);fc.up.set(Math.cos(-d0.pose.yaw),0,Math.sin(-d0.pose.yaw));fc.lookAt(d0.pose.x,ground,d0.pose.y);fpvDroneRenderer.render(scene,fc);if(dm)dm.visible=true}}
  if(fpvGo2Renderer&&store.go2s){var gi=Math.max(0,Math.min(fpvGo2Idx,store.go2s.length-1));var g0=store.go2s[gi];if(g0){var gm=go2Models[gi];if(gm)gm.visible=false;var ground=getGroundHeight(g0.pose.x,g0.pose.y);var yaw=g0.pose.yaw||0;var fx=Math.cos(yaw),fz=Math.sin(yaw);var head=go2HeadHeight(gm);var gc=new THREE.PerspectiveCamera(75,fg.clientWidth/Math.max(1,fg.clientHeight),0.1,200);gc.position.set(g0.pose.x+fx*0.35,ground+head,g0.pose.y+fz*0.35);gc.lookAt(g0.pose.x+fx*6,ground+head*.92,g0.pose.y+fz*6);fpvGo2Renderer.render(scene,gc);if(gm)gm.visible=true}}
  fpvHiddenHelpers.forEach(function(o,i){o.visible=helperVisibility[i]});
}

function updateCoordHud(){
  var el=document.getElementById('coord-hud');if(!el)return;
  var rd=store.drones?store.drones.find(function(dd){return dd.name===sfpv}):null;
  if(!rd&&store.go2s)rd=store.go2s.find(function(gg){return gg.name===sfpv});
  if(!rd||!rd.pose){el.innerHTML='Selected: --<br>X: -- | Z: -- | Y: --';return}
  var x=rd.pose.x||0,z=rd.pose.y||0;
  var y=rd.pose.world_y!=null?rd.pose.world_y:(rd.pose.z!=null?rd.pose.z:getGroundHeight(x,z));
  var yaw=rd.pose.yaw||0;
  el.innerHTML='Selected: '+rd.name+'<br>X: '+x.toFixed(2)+' | Z(field y): '+z.toFixed(2)+' | Y: '+y.toFixed(2)+'<br>yaw: '+yaw.toFixed(2)+' rad / '+(yaw*180/Math.PI).toFixed(0)+' deg';
}

document.querySelectorAll('.tab-btn').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('.tab-btn').forEach(function(x){x.classList.remove('active')});this.classList.add('active');
  activeTab=this.dataset.tab;showActiveTab(true);
})});

function animate(){
  requestAnimationFrame(animate);
  if(!scene||!renderer||!renderer.domElement.parentNode)return;
  if(simViewMode==='follow'&&store){var followName=followRobot||sfpv;var rd=store.drones?store.drones.find(function(dd){return dd.name===followName}):null;if(!rd&&store.go2s)rd=store.go2s.find(function(gg){return gg.name===followName});if(rd){var gy=rd.pose.world_y!=null?rd.pose.world_y:getGroundHeight(rd.pose.x,rd.pose.y)+(rd.pose.z||0);smoothTarget.lerp(new THREE.Vector3(rd.pose.x,gy+1,rd.pose.y),0.05);ctg.copy(smoothTarget);cp+=((0.55)-cp)*0.04}}
  if(simViewMode==='free'){
    var move=.45,forward=new THREE.Vector3(Math.sin(ct),0,Math.cos(ct)),right=new THREE.Vector3(Math.cos(ct),0,-Math.sin(ct));
    if(freeKeys['w']||freeKeys['arrowup'])ctg.addScaledVector(forward,move);
    if(freeKeys['s']||freeKeys['arrowdown'])ctg.addScaledVector(forward,-move);
    if(freeKeys['a']||freeKeys['arrowleft'])ctg.addScaledVector(right,-move);
    if(freeKeys['d']||freeKeys['arrowright'])ctg.addScaledVector(right,move);
    if(freeKeys['q'])ctg.y+=move;
    if(freeKeys['e'])ctg.y-=move;
  }
  camera.position.set(ctg.x+cd*Math.sin(ct)*Math.cos(cp),ctg.y+cd*Math.sin(cp),ctg.z+cd*Math.cos(ct)*Math.cos(cp));camera.lookAt(ctg);
  droneMeshes.forEach(function(dm){dm.children.forEach(function(c){if(c.name==='prop')c.rotation.y+=.35})});
  var sw=document.getElementById('sim-wrap');if(sw&&sw.clientWidth>0){renderer.setSize(sw.clientWidth,sw.clientHeight);camera.aspect=sw.clientWidth/sw.clientHeight;camera.updateProjectionMatrix()}
  updateCoordHud();
  renderer.render(scene,camera);renderFpv();
}

initScene();connectWS();setupFpvRenderers();showActiveTab(true);animate();
</script>
